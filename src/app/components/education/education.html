<section id="education" class="section education">
  <div class="container">
    <div appReveal="up">
      <span class="eyebrow">{{ 'education.eyebrow' | translate }}</span>
      <h2 class="section-title">{{ 'education.title' | translate }}</h2>
      <p class="section-lead">{{ 'education.lead' | translate }}</p>
    </div>

    <div class="timeline" appReveal="up" revealStagger=".timeline-item" [revealDelay]="120">
      @for (item of education; track item.period) {
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card glass">
            <span class="period">{{ item.period }}</span>
            <h3>{{ language.isFr() ? item.title.fr : item.title.en }}</h3>
            <p>{{ item.place }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
