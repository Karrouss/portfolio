<section id="about" class="section skills">
  <div class="container">
    <div appReveal="up">
      <span class="eyebrow">{{ 'skills.eyebrow' | translate }}</span>
      <h2 class="section-title">{{ 'skills.title' | translate }}</h2>
      <p class="section-lead">{{ 'skills.lead' | translate }}</p>
    </div>

    <div class="bars glass" #bars appReveal="up" [revealDelay]="120">
      @for (skill of skills; track skill.name) {
        <div class="bar-row">
          <div class="bar-head">
            <span>{{ skill.name }}</span>
            <span class="bar-percent">{{ skill.level }}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" [attr.data-level]="skill.level"></div>
          </div>
        </div>
      }
    </div>

    <div class="tools" appReveal="up" [revealDelay]="200">
      <span class="tools-title">{{ 'skills.tools_title' | translate }}</span>
      <div class="marquee">
        <div class="marquee-track">
          @for (tool of tools; track $index) {
            <span class="pill">{{ tool }}</span>
          }
        </div>
      </div>
    </div>
  </div>
</section>
